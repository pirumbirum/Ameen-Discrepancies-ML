name: "02: Pass 1 - Metadata Sweep"

# Purpose: Pull metadata for ~50K federal corporate litigation cases.
# Estimated: ~2,500 API calls, ~30 minutes.
# Safety: Read-only API calls. Saves results as artifacts.
#          Does NOT commit to repo -- human reviews artifacts first.
# Run: Manual only.

on:
  workflow_dispatch:
    inputs:
      date_start:
        description: "Start date (YYYY-MM-DD)"
        default: "2015-01-01"
        required: true
      date_end:
        description: "End date (YYYY-MM-DD)"
        default: "2025-12-31"
        required: true
      nos_tier:
        description: "Which NOS tier to pull (tier1, tier2, all)"
        default: "all"
        required: true
        type: choice
        options:
          - tier1
          - tier2
          - all
      dry_run:
        description: "Dry run (only fetch 2 pages per NOS)"
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  metadata-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Pass 1 metadata sweep
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          DATE_START: ${{ inputs.date_start }}
          DATE_END: ${{ inputs.date_end }}
          NOS_TIER: ${{ inputs.nos_tier }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/pass1_metadata_sweep.py

      - name: Upload metadata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass1-metadata-${{ github.run_id }}
          path: output/
          retention-days: 90
