name: "17: Sweep trade_secret (full)"

on:
  push:
    branches:
      - claude/review-previous-chats-iDzNp
    paths:
      - 'scripts/sweep_trade_secret.py'
      - '.github/workflows/17_sweep_trade_secret.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run sweep
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/sweep_trade_secret.py 2>&1 | tee research/sweep_trade_secret_log.txt

      - name: Final commit
        if: always()
        run: |
          git add research/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Sweep trade_secret: final results"
          git push
