name: "18: Rank BOTH cases"

on:
  push:
    branches:
      - claude/review-previous-chats-iDzNp
    paths:
      - 'scripts/rank_both_cases.py'
      - '.github/workflows/18_rank_both_cases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ranking
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/rank_both_cases.py 2>&1 | tee research/rank_both_log.txt

      - name: Commit results
        if: always()
        run: |
          git add research/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Top 100 trade_secret cases ranked by opinions + RECAP docs"
          git push
