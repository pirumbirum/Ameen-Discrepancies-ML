name: "09: Diagnostic"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: "Diagnostic: git state + API + checkpoint"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
        run: |
          set -x

          echo "=== Git state ==="
          git rev-parse --abbrev-ref HEAD
          git log --oneline -3
          git remote -v

          echo "=== Configure git ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Test API (fetch 1 docket entry for case 69645400) ==="
          python3 -c "
          import json, urllib.request, os
          token = os.environ['CL_API_TOKEN']
          url = 'https://www.courtlistener.com/api/rest/v4/docket-entries/?docket=69645400&format=json&page_size=3'
          headers = {'Authorization': f'Token {token}', 'User-Agent': 'test/1.0'}
          req = urllib.request.Request(url, headers=headers)
          resp = urllib.request.urlopen(req, timeout=30)
          data = json.loads(resp.read().decode())
          print(f'count: {data.get(\"count\", 0)}')
          print(f'results: {len(data.get(\"results\", []))}')
          if data.get('results'):
              entry = data['results'][0]
              print(f'entry #{entry.get(\"entry_number\")}: {entry.get(\"description\", \"\")[:80]}')
              recap = entry.get('recap_documents', [])
              print(f'recap_documents: {len(recap)}')
              if recap:
                  print(f'  first doc plain_text len: {len(recap[0].get(\"plain_text\", \"\"))}')
          else:
              print('NO RESULTS')
              print(json.dumps(data, indent=2)[:500])
          "

          echo "=== Test checkpoint ==="
          mkdir -p golden_set/_test
          echo '{"test": true}' > golden_set/_test/diagnostic.json
          git add golden_set/_test/
          git diff --cached --stat
          git commit -m "Diagnostic checkpoint test"
          git push
          echo "Push succeeded!"

          echo "=== Cleanup ==="
          git rm -r golden_set/_test/
          git commit -m "Remove diagnostic test file"
          git push
          echo "Cleanup push succeeded!"
