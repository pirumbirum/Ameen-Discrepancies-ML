name: "09: Diagnostic"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "Test 1: Git state"
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Remote: $(git remote get-url origin)"

      - name: "Test 2: API fetch"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
        run: |
          python3 -c "
          import json, urllib.request, os
          token = os.environ.get('CL_API_TOKEN', '')
          print(f'Token present: {bool(token)}')
          print(f'Token length: {len(token)}')
          url = 'https://www.courtlistener.com/api/rest/v4/docket-entries/?docket=69645400&format=json&page_size=3'
          headers = {'Authorization': f'Token {token}', 'User-Agent': 'test/1.0'}
          req = urllib.request.Request(url, headers=headers)
          resp = urllib.request.urlopen(req, timeout=30)
          data = json.loads(resp.read().decode())
          print(f'API response count: {data.get(\"count\", 0)}')
          print(f'Results on page: {len(data.get(\"results\", []))}')
          if data.get('results'):
              e = data['results'][0]
              print(f'Entry #{e.get(\"entry_number\")}: {e.get(\"description\", \"\")[:80]}')
              rd = e.get('recap_documents', [])
              print(f'Recap docs: {len(rd)}')
              if rd:
                  print(f'  plain_text length: {len(rd[0].get(\"plain_text\", \"\"))}')
          "

      - name: "Test 3: Git push"
        run: |
          mkdir -p golden_set/_test
          echo '{"diagnostic": true, "time": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > golden_set/_test/test.json
          git add golden_set/_test/
          git commit -m "Diagnostic: test push"
          git push
          echo "PUSH OK"

      - name: "Test 4: Cleanup"
        if: always()
        run: |
          rm -rf golden_set/_test
          git add -A golden_set/_test 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Diagnostic: cleanup" && git push || true
