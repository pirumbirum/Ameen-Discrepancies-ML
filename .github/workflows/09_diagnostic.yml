name: "09: Diagnostic"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "Test 1: Git state"
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Remote: $(git remote get-url origin)"

      - name: "Test 2: API fetch"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: |
          python3 -c "
          import json, urllib.request, urllib.error, os, traceback

          cl_token = os.environ.get('CL_API_TOKEN', '')
          cl2_token = os.environ.get('COURTLISTENER_TOKEN', '')
          print(f'CL_API_TOKEN present: {bool(cl_token)}, length: {len(cl_token)}')
          print(f'COURTLISTENER_TOKEN present: {bool(cl2_token)}, length: {len(cl2_token)}')

          # Try the token
          token = cl_token or cl2_token
          if not token:
              print('ERROR: No token found')
              exit(1)

          # Test 1: simple courts endpoint
          print('\n--- Test courts endpoint ---')
          try:
              url = 'https://www.courtlistener.com/api/rest/v4/courts/?format=json&page_size=1'
              req = urllib.request.Request(url, headers={'Authorization': f'Token {token}', 'User-Agent': 'test/1.0'})
              resp = urllib.request.urlopen(req, timeout=30)
              data = json.loads(resp.read().decode())
              print(f'Courts OK: count={data.get(\"count\", 0)}')
          except urllib.error.HTTPError as e:
              print(f'Courts FAILED: HTTP {e.code}')
              print(f'Body: {e.read().decode()[:300]}')
              exit(1)
          except Exception as e:
              print(f'Courts ERROR: {e}')
              traceback.print_exc()
              exit(1)

          # Test 2: docket entries
          print('\n--- Test docket entries ---')
          try:
              url = 'https://www.courtlistener.com/api/rest/v4/docket-entries/?docket=69645400&format=json&page_size=3'
              req = urllib.request.Request(url, headers={'Authorization': f'Token {token}', 'User-Agent': 'test/1.0'})
              resp = urllib.request.urlopen(req, timeout=30)
              data = json.loads(resp.read().decode())
              count = data.get('count', 0)
              results = data.get('results', [])
              print(f'Docket entries OK: count={count}, page_results={len(results)}')
              if results:
                  e = results[0]
                  print(f'  Entry #{e.get(\"entry_number\")}: {e.get(\"description\", \"\")[:80]}')
                  rd = e.get('recap_documents', [])
                  print(f'  Recap docs: {len(rd)}')
                  if rd:
                      print(f'    plain_text length: {len(rd[0].get(\"plain_text\", \"\"))}')
              else:
                  print('  NO RESULTS (but no error)')
          except urllib.error.HTTPError as e:
              print(f'Docket entries FAILED: HTTP {e.code}')
              print(f'Body: {e.read().decode()[:300]}')
          except Exception as e:
              print(f'Docket entries ERROR: {e}')
              traceback.print_exc()

          print('\nAPI test complete')
          "

      - name: "Test 3: Git push"
        run: |
          mkdir -p golden_set/_test
          echo '{"diagnostic": true, "time": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > golden_set/_test/test.json
          git add golden_set/_test/
          git commit -m "Diagnostic: test push"
          git push
          echo "PUSH OK"

      - name: "Test 4: Cleanup"
        if: always()
        run: |
          rm -rf golden_set/_test
          git add -A golden_set/_test 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Diagnostic: cleanup" && git push || true
