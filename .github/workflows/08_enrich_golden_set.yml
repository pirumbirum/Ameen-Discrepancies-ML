name: "08: Enrich Golden Set"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean markers
        run: |
          python3 -c "
          import json, os
          cleaned = 0
          for root, dirs, files in os.walk('golden_set'):
              if '_done.json' in files:
                  marker = os.path.join(root, '_done.json')
                  try:
                      m = json.load(open(marker))
                      if m.get('status') != 'ok':
                          os.remove(marker)
                          cleaned += 1
                  except:
                      os.remove(marker)
                      cleaned += 1
          print(f'Cleaned {cleaned} invalid markers')
          "

      - name: "Phase 1: Full Docket"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py full_docket

      - name: "Save Phase 1"
        if: always()
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Phase 1: full_docket complete"
          git push

      - name: "Phase 2: Docket Entries"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py docket_entries

      - name: "Save Phase 2"
        if: always()
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Phase 2: docket_entries complete"
          git push

      - name: "Phase 3: Citations"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py citations

      - name: "Save Phase 3"
        if: always()
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Phase 3: citations complete"
          git push

      - name: "Phase 4: Oral Arguments"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py oral_arguments

      - name: "Save Phase 4"
        if: always()
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Phase 4: oral_arguments complete"
          git push

      - name: "Phase 5: Judge Profiles"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py judge_profiles

      - name: "Save Phase 5"
        if: always()
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Phase 5: judge_profiles complete"
          git push

      - name: "Phase 6: Financial Disclosures"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py financial_disclosures

      - name: "Save Phase 6"
        if: always()
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Phase 6: financial_disclosures complete"
          git push

      - name: "Status Report"
        if: always()
        run: |
          python3 -c "
          import json, os
          layers = ['full_docket', 'docket_entries', 'citations', 'oral_arguments', 'judge_profiles', 'financial_disclosures']
          total = sum(1 for cat in os.listdir('golden_set') if os.path.isdir(os.path.join('golden_set', cat))
                      for c in os.listdir(os.path.join('golden_set', cat))
                      if os.path.isdir(os.path.join('golden_set', cat, c)))
          for layer in layers:
              done = sum(1 for root, dirs, _ in os.walk('golden_set') if layer in dirs
                        and os.path.isfile(os.path.join(root, layer, '_done.json'))
                        and json.load(open(os.path.join(root, layer, '_done.json'))).get('status') == 'ok')
              pct = done / max(total, 1) * 100
              print(f'  {layer:30s} {done:>5}/{total} ({pct:.0f}%)')
          " 2>/dev/null || true
          du -sh golden_set/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-enriched-${{ github.run_id }}
          path: golden_set/
          retention-days: 90
