name: "08: Enrich Golden Set"

# Fetches COMPLETE structured data for each golden set case:
#   Phase 1: full_docket           — complete docket (40+ fields, parties inline)
#   Phase 2: docket_entries        — every filing + nested RECAP docs with FULL TEXT
#   Phase 3: citations             — citation graph (citing + cited_by)
#   Phase 4: oral_arguments        — oral argument audio metadata
#   Phase 5: judge_profiles        — judge person records (positions, education)
#   Phase 6: financial_disclosures — judge financial disclosures
#
# Each docket entry contains nested recap_documents with plain_text —
# this is the actual document text, not just metadata.
#
# Resumable: re-run picks up where it stopped.
# Periodic git checkpoints save progress.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Clean bad markers from previous runs"
        run: |
          python3 scripts/enrich_golden_set.py all --clean-bad-markers --commit-every 0 2>&1 | head -5 || true
          # The script exits after cleaning if --commit-every=0 and phase=all,
          # so we just want the cleaning side effect.
          # Actually, let's just do it inline:
          python3 -c "
          import json, os
          cleaned = 0
          for root, dirs, files in os.walk('golden_set'):
              if '_done.json' in files:
                  marker = os.path.join(root, '_done.json')
                  try:
                      m = json.load(open(marker))
                      if m.get('status') != 'ok':
                          os.remove(marker)
                          cleaned += 1
                  except:
                      os.remove(marker)
                      cleaned += 1
          print(f'Cleaned {cleaned} invalid markers')
          "

      - name: "Enrich: all 6 phases"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
        run: |
          python3 scripts/enrich_golden_set.py all --commit-every 50

      - name: Summary
        if: always()
        run: |
          echo "=== Enrichment layer counts ==="
          for layer in full_docket docket_entries citations oral_arguments judge_profiles financial_disclosures; do
            count=$(find golden_set -path "*/${layer}/_done.json" -exec grep -l '"status": "ok"' {} \; 2>/dev/null | wc -l)
            echo "  ${layer}: ${count} cases enriched"
          done
          echo ""
          echo "=== Docket entries text coverage ==="
          python3 -c "
          import json, os
          total_entries = 0
          total_docs = 0
          docs_with_text = 0
          for root, dirs, files in os.walk('golden_set'):
              if 'entries.json' in files and 'docket_entries' in root:
                  entries = json.load(open(os.path.join(root, 'entries.json')))
                  total_entries += len(entries)
                  for e in entries:
                      for d in e.get('recap_documents', []):
                          total_docs += 1
                          if d.get('plain_text'):
                              docs_with_text += 1
          print(f'  Total docket entries: {total_entries:,}')
          print(f'  Total RECAP documents: {total_docs:,}')
          print(f'  Documents with full text: {docs_with_text:,}')
          " 2>/dev/null || true
          echo ""
          du -sh golden_set/

      - name: Final commit
        if: always()
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "All committed during enrichment" && exit 0
          git commit -m "Enrich golden set: final commit"
          git push

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-enriched-${{ github.run_id }}
          path: golden_set/
          retention-days: 90
