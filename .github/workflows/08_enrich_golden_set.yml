name: "08: Enrich Golden Set"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean bad markers
        run: python3 scripts/enrich_golden_set.py all --clean-bad-markers --limit 0 || true

      # ── DIAGNOSTIC: 5 cases, all 10 phases ──
      - name: "DIAGNOSTIC: 5 cases, all phases"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py all --limit 5

      - name: "Save diagnostic"
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Diagnostic: 5 cases enriched (all 10 phases)"
          git push
          echo "DIAGNOSTIC SAVED"

      # ── PHASE 1: Full Docket (already done for most, will skip) ──
      - name: "Phase 1: Full Docket"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py full_docket

      - name: "Save Phase 1"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 1: full_docket done" && git push

      # ── PHASE 2: Docket Entries in batches of 200 ──
      - name: "Phase 2 batch 1: docket_entries 1-200"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py docket_entries --limit 200

      - name: "Save docket_entries batch 1"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 2: docket_entries 1-200" && git push

      - name: "Phase 2 batch 2: docket_entries 201-400"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py docket_entries --limit 400

      - name: "Save docket_entries batch 2"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 2: docket_entries 201-400" && git push

      - name: "Phase 2 batch 3: docket_entries 401-600"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py docket_entries --limit 600

      - name: "Save docket_entries batch 3"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 2: docket_entries 401-600" && git push

      - name: "Phase 2 batch 4: docket_entries 601-800"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py docket_entries --limit 800

      - name: "Save docket_entries batch 4"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 2: docket_entries 601-800" && git push

      - name: "Phase 2 batch 5: docket_entries 801-1100"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py docket_entries

      - name: "Save docket_entries batch 5"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 2: docket_entries 801-1100" && git push

      # ── PHASE 3: Parties in batches of 200 ──
      - name: "Phase 3 batch 1: parties 1-200"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py parties --limit 200

      - name: "Save parties batch 1"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 3: parties 1-200" && git push

      - name: "Phase 3 batch 2: parties 201-400"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py parties --limit 400

      - name: "Save parties batch 2"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 3: parties 201-400" && git push

      - name: "Phase 3 batch 3: parties 401-600"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py parties --limit 600

      - name: "Save parties batch 3"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 3: parties 401-600" && git push

      - name: "Phase 3 batch 4: parties 601-800"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py parties --limit 800

      - name: "Save parties batch 4"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 3: parties 601-800" && git push

      - name: "Phase 3 batch 5: parties 801-1100"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py parties

      - name: "Save parties batch 5"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 3: parties 801-1100" && git push

      # ── PHASE 4: Attorneys in batches of 200 ──
      - name: "Phase 4 batch 1: attorneys 1-200"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py attorneys --limit 200

      - name: "Save attorneys batch 1"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 4: attorneys 1-200" && git push

      - name: "Phase 4 batch 2: attorneys 201-400"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py attorneys --limit 400

      - name: "Save attorneys batch 2"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 4: attorneys 201-400" && git push

      - name: "Phase 4 batch 3: attorneys 401-600"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py attorneys --limit 600

      - name: "Save attorneys batch 3"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 4: attorneys 401-600" && git push

      - name: "Phase 4 batch 4: attorneys 601-800"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py attorneys --limit 800

      - name: "Save attorneys batch 4"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 4: attorneys 601-800" && git push

      - name: "Phase 4 batch 5: attorneys 801-1100"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py attorneys

      - name: "Save attorneys batch 5"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 4: attorneys 801-1100" && git push

      # ── PHASES 5-10: Opinions, RECAP docs, Citations, Oral Args, Judges, Disclosures ──
      - name: "Phase 5: Opinions"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py opinions

      - name: "Save Phase 5"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 5: opinions done" && git push

      - name: "Phase 6: RECAP Documents"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py recap_documents

      - name: "Save Phase 6"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 6: recap_documents done" && git push

      - name: "Phase 7: Citations"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py citations

      - name: "Save Phase 7"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 7: citations done" && git push

      - name: "Phase 8: Oral Arguments"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py oral_arguments

      - name: "Save Phase 8"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 8: oral_arguments done" && git push

      - name: "Phase 9: Judge Profiles"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py judge_profiles

      - name: "Save Phase 9"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 9: judge_profiles done" && git push

      - name: "Phase 10: Financial Disclosures"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py financial_disclosures

      - name: "Save Phase 10"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 10: financial_disclosures done" && git push

      # ── REPORT ──
      - name: "Report"
        if: always()
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: |
          python3 -c "
          import json, os
          layers = ['full_docket', 'docket_entries', 'parties', 'attorneys', 'opinions',
                    'recap_documents', 'citations', 'oral_arguments', 'judge_profiles', 'financial_disclosures']
          total = sum(1 for cat in os.listdir('golden_set') if os.path.isdir(os.path.join('golden_set', cat))
                      for c in os.listdir(os.path.join('golden_set', cat))
                      if os.path.isdir(os.path.join('golden_set', cat, c)))
          print(f'Total cases: {total}')
          for layer in layers:
              done = 0
              for root, dirs, _ in os.walk('golden_set'):
                  if layer in dirs:
                      m_path = os.path.join(root, layer, '_done.json')
                      if os.path.isfile(m_path):
                          try:
                              m = json.load(open(m_path))
                              if m.get('status') == 'ok': done += 1
                          except: pass
              pct = done / max(total, 1) * 100
              print(f'  {layer:30s} {done:>5}/{total} ({pct:.0f}%)')
          # Parties detail
          tp = 0
          for root, dirs, _ in os.walk('golden_set'):
              m_path = os.path.join(root, 'parties', '_done.json')
              if os.path.isfile(m_path):
                  try:
                      m = json.load(open(m_path))
                      if m.get('status') == 'ok': tp += m.get('party_count', 0)
                  except: pass
          print(f'\nParties total: {tp:,}')
          # Attorneys detail
          ta = 0
          for root, dirs, _ in os.walk('golden_set'):
              m_path = os.path.join(root, 'attorneys', '_done.json')
              if os.path.isfile(m_path):
                  try:
                      m = json.load(open(m_path))
                      if m.get('status') == 'ok': ta += m.get('attorney_count', 0)
                  except: pass
          print(f'Attorneys total: {ta:,}')
          # Docket entries detail
          te = td = dt = 0
          for root, dirs, _ in os.walk('golden_set'):
              m_path = os.path.join(root, 'docket_entries', '_done.json')
              if os.path.isfile(m_path):
                  try:
                      m = json.load(open(m_path))
                      if m.get('status') == 'ok':
                          te += m.get('entry_count', 0)
                          td += m.get('recap_doc_count', 0)
                          dt += m.get('docs_with_text', 0)
                  except: pass
          print(f'Docket detail: {te:,} entries, {td:,} docs, {dt:,} with text')
          " 2>/dev/null || true
          du -sh golden_set/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-enriched-${{ github.run_id }}
          path: golden_set/
          retention-days: 90
