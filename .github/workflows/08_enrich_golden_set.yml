name: "08: Enrich Golden Set"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean bad markers
        run: python3 scripts/enrich_golden_set.py all --clean-bad-markers --limit 0 || true

      # ── DIAGNOSTIC: 5 cases, all 6 phases ──
      - name: "DIAGNOSTIC: 5 cases"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py all --limit 5

      - name: "Save diagnostic"
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Diagnostic: 5 cases enriched"
          git push

      # ── PHASE 1: Full Docket (already done, will skip) ──
      - name: "Phase 1: Full Docket"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py full_docket

      - name: "Save Phase 1"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 1: full_docket" && git push

      # ── PHASE 2: Opinions in batches ──
      - name: "Phase 2a: Opinions 1-300"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py opinions --limit 300

      - name: "Save 2a"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 2: opinions 1-300" && git push

      - name: "Phase 2b: Opinions 301-600"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py opinions --limit 600

      - name: "Save 2b"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 2: opinions 301-600" && git push

      - name: "Phase 2c: Opinions 601-900"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py opinions --limit 900

      - name: "Save 2c"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 2: opinions 601-900" && git push

      - name: "Phase 2d: Opinions 901-1100"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py opinions

      - name: "Save 2d"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 2: opinions 901-1100" && git push

      # ── PHASE 3: Citations ──
      - name: "Phase 3a: Citations 1-300"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py citations --limit 300

      - name: "Save 3a"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 3: citations 1-300" && git push

      - name: "Phase 3b: Citations 301-600"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py citations --limit 600

      - name: "Save 3b"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 3: citations 301-600" && git push

      - name: "Phase 3c: Citations 601-900"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py citations --limit 900

      - name: "Save 3c"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 3: citations 601-900" && git push

      - name: "Phase 3d: Citations 901-1100"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py citations

      - name: "Save 3d"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 3: citations 901-1100" && git push

      # ── PHASES 4-6: Oral Args, Judges, Disclosures ──
      - name: "Phase 4: Oral Arguments"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py oral_arguments

      - name: "Save Phase 4"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 4: oral_arguments" && git push

      - name: "Phase 5: Judge Profiles"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py judge_profiles

      - name: "Save Phase 5"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 5: judge_profiles" && git push

      - name: "Phase 6: Financial Disclosures"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/enrich_golden_set.py financial_disclosures

      - name: "Save Phase 6"
        if: always()
        run: |
          git add golden_set/ && git diff --cached --quiet && exit 0
          git commit -m "Phase 6: financial_disclosures" && git push

      # ── REPORT ──
      - name: "Report"
        if: always()
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: |
          python3 -c "
          import json, os
          layers = ['full_docket', 'opinions', 'citations', 'oral_arguments', 'judge_profiles', 'financial_disclosures']
          total = sum(1 for cat in os.listdir('golden_set') if os.path.isdir(os.path.join('golden_set', cat))
                      for c in os.listdir(os.path.join('golden_set', cat))
                      if os.path.isdir(os.path.join('golden_set', cat, c)))
          print(f'Total cases: {total}')
          for layer in layers:
              done = 0
              for root, dirs, _ in os.walk('golden_set'):
                  if layer in dirs:
                      m_path = os.path.join(root, layer, '_done.json')
                      if os.path.isfile(m_path):
                          try:
                              m = json.load(open(m_path))
                              if m.get('status') == 'ok': done += 1
                          except: pass
              pct = done / max(total, 1) * 100
              print(f'  {layer:30s} {done:>5}/{total} ({pct:.0f}%)')
          " 2>/dev/null || true
          du -sh golden_set/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-enriched-${{ github.run_id }}
          path: golden_set/
          retention-days: 90
