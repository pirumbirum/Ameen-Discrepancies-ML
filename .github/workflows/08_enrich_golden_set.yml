name: "08: Enrich Golden Set"

# Downloads COMPLETE data for all 1,100 golden set cases.
# Saves every 15 minutes with a status report.
# Resumable — re-run picks up where it stopped.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Clean invalid markers"
        run: |
          python3 -c "
          import json, os
          cleaned = 0
          for root, dirs, files in os.walk('golden_set'):
              if '_done.json' in files:
                  marker = os.path.join(root, '_done.json')
                  try:
                      m = json.load(open(marker))
                      if m.get('status') != 'ok':
                          os.remove(marker)
                          cleaned += 1
                  except:
                      os.remove(marker)
                      cleaned += 1
          print(f'Cleaned {cleaned} invalid markers')
          "

      - name: "Enrich: all 6 phases (saves every 15 min)"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
        run: |
          python3 scripts/enrich_golden_set.py all --checkpoint-minutes 15

      - name: "Status Report"
        if: always()
        run: |
          python3 -c "
          import json, os

          print('=' * 60)
          print('ENRICHMENT STATUS REPORT')
          print('=' * 60)

          layers = ['full_docket', 'docket_entries', 'citations',
                    'oral_arguments', 'judge_profiles', 'financial_disclosures']

          total_cases = 0
          for cat in sorted(os.listdir('golden_set')):
              cat_dir = os.path.join('golden_set', cat)
              if os.path.isdir(cat_dir):
                  total_cases += len([c for c in os.listdir(cat_dir)
                                     if os.path.isdir(os.path.join(cat_dir, c))])

          print(f'Total cases: {total_cases}')
          print()

          for layer in layers:
              done = 0
              for root, dirs, files in os.walk('golden_set'):
                  if layer in dirs:
                      marker = os.path.join(root, layer, '_done.json')
                      if os.path.isfile(marker):
                          try:
                              m = json.load(open(marker))
                              if m.get('status') == 'ok':
                                  done += 1
                          except:
                              pass
              pct = done / max(total_cases, 1) * 100
              bar = '#' * int(pct / 2) + '.' * (50 - int(pct / 2))
              print(f'  {layer:30s} [{bar}] {done:>5}/{total_cases} ({pct:.0f}%)')

          # Docket entries detail
          print()
          print('Docket entries detail:')
          total_entries = 0
          total_docs = 0
          docs_with_text = 0
          for root, dirs, files in os.walk('golden_set'):
              if '_done.json' in files and 'docket_entries' in root:
                  try:
                      m = json.load(open(os.path.join(root, '_done.json')))
                      if m.get('status') == 'ok':
                          total_entries += m.get('entry_count', 0)
                          total_docs += m.get('recap_doc_count', 0)
                          docs_with_text += m.get('docs_with_text', 0)
                  except:
                      pass
          print(f'  Total docket entries: {total_entries:,}')
          print(f'  Total RECAP documents: {total_docs:,}')
          print(f'  Documents with full text: {docs_with_text:,}')

          print()
          print('Disk usage:')
          " 2>/dev/null || true
          du -sh golden_set/
          du -sh golden_set/*/  2>/dev/null | sort -rh | head -15

      - name: Final commit
        if: always()
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "All committed during enrichment" && exit 0
          git commit -m "Enrich golden set: final save"
          git pull --rebase origin HEAD || true
          git push

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-enriched-${{ github.run_id }}
          path: golden_set/
          retention-days: 90
