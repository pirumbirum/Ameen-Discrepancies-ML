name: "10: Build Golden Set General"

# Downloads CourtListener bulk opinion-clusters CSV from S3,
# intersects with cases2/ RECAP data → golden_set_general/
on:
  push:
    branches:
      - claude/integrate-api-keys-X96YT
    paths:
      - 'scripts/filter_golden_general.py'
      - '.github/workflows/10_build_golden_general.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Run filter (bulk CSV approach)"
        run: python3 scripts/filter_golden_general.py

      - name: "Verify output"
        if: always()
        run: |
          echo ""
          echo "=== MASTER INDEX ==="
          cat golden_set_general/index.json 2>/dev/null || echo "(none)"
          echo ""
          DOCKET_COUNT=$(find golden_set_general -name "docket.json" 2>/dev/null | wc -l)
          echo "=== TOTAL docket.json FILES: ${DOCKET_COUNT} ==="
          echo ""
          echo "=== CATEGORY COUNTS ==="
          for dir in golden_set_general/*/; do
            CAT=$(basename "$dir")
            COUNT=$(find "$dir" -name "docket.json" 2>/dev/null | wc -l)
            echo "  ${CAT}: ${COUNT}"
          done
          echo ""
          echo "=== SAMPLE docket.json ==="
          SAMPLE=$(find golden_set_general -name "docket.json" 2>/dev/null | head -1)
          if [ -n "$SAMPLE" ]; then
            python3 -c "
          import json
          d = json.load(open('$SAMPLE'))
          print(json.dumps({k: d.get(k) for k in ['id','case_name','source','court_id','nature_of_suit']}, indent=2))
          "
          else
            echo "(no docket.json found)"
          fi

      - name: "Final commit (safety net)"
        if: always()
        run: |
          git add golden_set_general/ || true
          if ! git diff --cached --quiet 2>/dev/null; then
            COUNT=$(find golden_set_general -name "docket.json" 2>/dev/null | wc -l)
            git commit -m "golden_set_general: safety-net commit — ${COUNT} cases"
            git push
          fi
