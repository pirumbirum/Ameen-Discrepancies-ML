name: "10: Build Golden Set General"

# Filters cases2/ for RECAP + opinion data → golden_set_general/
on:
  push:
    branches:
      - claude/integrate-api-keys-X96YT
    paths:
      - 'scripts/filter_golden_general.py'
      - '.github/workflows/10_build_golden_general.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - full

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: "Run filter"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          RUN_MODE: ${{ github.event.inputs.mode || 'test' }}
        run: |
          if [ "$RUN_MODE" = "full" ]; then
            echo "=== FULL RUN ==="
            python3 scripts/filter_golden_general.py
          else
            echo "=== TEST RUN ==="
            python3 scripts/filter_golden_general.py --test
          fi

      - name: "Verify output"
        if: always()
        run: |
          echo ""
          echo "=== FILES CREATED ==="
          find golden_set_general -type f 2>/dev/null | head -30 || echo "(none)"
          echo ""
          echo "=== CHECKPOINT ==="
          cat golden_set_general/_checkpoint.json 2>/dev/null || echo "(none)"
          echo ""
          echo "=== MASTER INDEX ==="
          cat golden_set_general/index.json 2>/dev/null || echo "(none)"
          echo ""
          DOCKET_COUNT=$(find golden_set_general -name "docket.json" 2>/dev/null | wc -l)
          echo "=== TOTAL docket.json FILES: ${DOCKET_COUNT} ==="
          echo ""
          echo "=== SAMPLE docket.json ==="
          SAMPLE=$(find golden_set_general -name "docket.json" 2>/dev/null | head -1)
          if [ -n "$SAMPLE" ]; then
            python3 -c "
          import json, sys
          d = json.load(open('$SAMPLE'))
          print(json.dumps({k: d.get(k) for k in ['id','case_name','source','court_id']}, indent=2))
          "
          else
            echo "(no docket.json found)"
          fi

      # Safety net: commit whatever we have
      - name: "Final commit (safety net)"
        if: always()
        run: |
          git add golden_set_general/ || true
          if ! git diff --cached --quiet 2>/dev/null; then
            COUNT=$(find golden_set_general -name "docket.json" 2>/dev/null | wc -l)
            git commit -m "golden_set_general: safety-net commit — ${COUNT} cases so far"
            git push
          fi
