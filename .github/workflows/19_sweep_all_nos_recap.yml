name: "19: Sweep ALL NOS — golden set + recap"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run all-NOS sweep
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/sweep_all_nos_recap.py 2>&1 | tee research/all_nos_sweep_log.txt

      - name: Final commit
        if: always()
        run: |
          git add golden_set_recap/ research/
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "All-NOS sweep: golden set + recap results"
          git push
