name: "07: Golden Set Builder"

# Option B pipeline (2 jobs):
#   Job 1 (build):  Stream clusters CSV → score → build golden_set/ → commit
#   Job 2 (fetch):  API-fetch opinion text for golden set clusters → commit
#
# Job 1 always succeeds (~10 min). Job 2 is resumable — re-run to continue.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BULK_DATE: "2025-12-31"
  S3_BASE: "https://com-courtlistener-storage.s3-us-west-2.amazonaws.com/bulk-data"
  STATE_DIR: "/tmp/golden_state"

jobs:
  # ── Job 1: Build scored golden_set structure ────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lbzip2
        run: sudo apt-get install -y lbzip2

      - name: Disk check
        run: df -h .

      - name: "Phase 1: Stream opinion clusters"
        run: |
          set +o pipefail
          echo "Downloading + filtering opinion-clusters-${BULK_DATE}.csv.bz2 ..."
          curl -fSL "${S3_BASE}/opinion-clusters-${BULK_DATE}.csv.bz2" \
            | lbzip2 -d \
            | python3 scripts/build_golden_set.py clusters --state-dir "$STATE_DIR"
          RESULT=${PIPESTATUS[2]}
          echo "Python exit code: $RESULT"
          test -f "$STATE_DIR/cluster_ids.json" || { echo "FATAL: no cluster_ids.json produced"; exit 1; }
          exit $RESULT

      - name: "Phase 1 checkpoint"
        run: |
          python3 -c "
          import json
          with open('${{ env.STATE_DIR }}/cluster_ids.json') as f:
              ids = json.load(f)
          print(f'Phase 1: {len(ids):,} clusters matched')
          "

      - name: "Phase 2: Score + build golden_set/"
        run: python3 scripts/build_golden_set.py score --state-dir "$STATE_DIR"

      - name: "Phase 2 summary"
        run: |
          python3 -c "
          import json
          with open('golden_set/index.json') as f:
              idx = json.load(f)
          print(f'Total golden cases: {idx[\"total_golden_cases\"]}')
          print()
          for cat, info in sorted(idx['categories'].items()):
              print(f'  {info[\"nos_code\"]} {cat:20s}  '
                    f'top={info[\"top_n_saved\"]:>3}  '
                    f'scores={info[\"cutoff_score\"]}-{info[\"top_score\"]}  '
                    f'(of {info[\"total_with_opinions\"]:,} with clusters)')
          "
          echo ""
          python3 -c "
          import json
          with open('${{ env.STATE_DIR }}/golden_cluster_paths.json') as f:
              paths = json.load(f)
          print(f'Clusters for Phase 3 API fetch: {len(paths):,}')
          "

      - name: Commit golden_set structure
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Golden set: scored structure (clusters-only, no opinion text yet)"
          git push

      - name: Upload state for fetch job
        uses: actions/upload-artifact@v4
        with:
          name: golden-state-${{ github.run_id }}
          path: /tmp/golden_state/
          retention-days: 1

  # ── Job 2: API-fetch opinion text for golden set ────────────────
  fetch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout (with latest commit from build job)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest (build job's commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }} --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download state from build job
        uses: actions/download-artifact@v4
        with:
          name: golden-state-${{ github.run_id }}
          path: /tmp/golden_state/

      - name: "Phase 3: API-fetch opinions (resumable, auto-commits)"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
        run: |
          python3 scripts/build_golden_set.py opinions \
            --state-dir "$STATE_DIR" \
            --commit-every 500

      - name: Show golden set summary
        run: |
          echo "=== File counts per category ==="
          for d in golden_set/*/; do
            name=$(basename "$d")
            cases=$(find "$d" -name "docket.json" | wc -l)
            opinions=$(find "$d" -name "opinion_*.json" | wc -l)
            echo "  $name: $cases cases, $opinions opinion files"
          done
          echo ""
          du -sh golden_set/

      - name: Final commit (if any uncommitted opinions)
        run: |
          git add golden_set/
          git diff --cached --quiet && echo "All committed during Phase 3" && exit 0
          OPINIONS=$(find golden_set -name "opinion_*.json" | wc -l)
          git commit -m "Golden set: ${OPINIONS} total opinion files"
          git push

      - name: Upload final artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-${{ github.run_id }}
          path: golden_set/
          retention-days: 90
