name: "07: Golden Set Builder"

# Option B pipeline:
#   Phase 1: Stream opinion-clusters CSV (~5 min) → match to 275K docket IDs
#   Phase 2: Score from cluster data only (citations, published, SCOTUS) → build golden_set/
#   Phase 3: API-fetch full opinion text for just the ~1,100 golden set cases
#
# ETA: ~20-30 minutes total.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BULK_DATE: "2025-12-31"
  S3_BASE: "https://com-courtlistener-storage.s3-us-west-2.amazonaws.com/bulk-data"
  STATE_DIR: "/tmp/golden_state"

jobs:
  golden-set:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lbzip2
        run: sudo apt-get install -y lbzip2

      - name: Disk check (before)
        run: df -h .

      - name: "Phase 1: Stream opinion clusters"
        run: |
          set +o pipefail
          echo "Downloading + filtering opinion-clusters-${BULK_DATE}.csv.bz2 ..."
          curl -fSL "${S3_BASE}/opinion-clusters-${BULK_DATE}.csv.bz2" \
            | lbzip2 -d \
            | python3 scripts/build_golden_set.py clusters --state-dir "$STATE_DIR"
          RESULT=${PIPESTATUS[2]}
          echo "Python exit code: $RESULT"
          test -f "$STATE_DIR/cluster_ids.json" || { echo "FATAL: no cluster_ids.json produced"; exit 1; }
          exit $RESULT

      - name: "Phase 1 checkpoint"
        run: |
          echo "Cluster IDs collected:"
          python3 -c "
          import json
          with open('${{ env.STATE_DIR }}/cluster_ids.json') as f:
              ids = json.load(f)
          print(f'  {len(ids):,} clusters matched')
          "

      - name: "Phase 2: Score + build golden_set/"
        run: python3 scripts/build_golden_set.py score --state-dir "$STATE_DIR"

      - name: "Phase 2 checkpoint"
        run: |
          echo "=== Golden Set Index ==="
          python3 -c "
          import json
          with open('golden_set/index.json') as f:
              idx = json.load(f)
          print(f'Total golden cases: {idx[\"total_golden_cases\"]}')
          print()
          for cat, info in idx['categories'].items():
              print(f'  {info[\"nos_code\"]} {cat:20s}  '
                    f'top={info[\"top_n_saved\"]:>3}  '
                    f'score_range={info[\"cutoff_score\"]}-{info[\"top_score\"]}  '
                    f'(of {info[\"total_with_opinions\"]:,} with opinions)')
          "
          echo ""
          echo "=== Clusters to fetch opinions for ==="
          python3 -c "
          import json
          with open('${{ env.STATE_DIR }}/golden_cluster_paths.json') as f:
              paths = json.load(f)
          print(f'  {len(paths):,} clusters')
          "

      - name: "Phase 3: API-fetch opinions for golden set"
        env:
          CL_API_TOKEN: ${{ secrets.CL_API_TOKEN }}
        run: python3 scripts/build_golden_set.py opinions --state-dir "$STATE_DIR"

      - name: Show golden set summary
        run: |
          echo "=== Folder structure (sample) ==="
          find golden_set -maxdepth 5 -type f | head -30
          echo "..."
          echo ""
          echo "=== File counts per category ==="
          for d in golden_set/*/; do
            name=$(basename "$d")
            cases=$(find "$d" -name "docket.json" | wc -l)
            opinions=$(find "$d" -name "opinion_*.json" | wc -l)
            echo "  $name: $cases cases, $opinions opinion files"
          done
          echo ""
          echo "=== Disk usage ==="
          du -sh golden_set/

      - name: Commit golden set
        run: |
          git add golden_set/ cases2.1/
          COUNT=$(python3 -c "
          import json
          with open('golden_set/index.json') as f:
              print(json.load(f)['total_golden_cases'])
          " 2>/dev/null || echo "???")
          git diff --cached --quiet || git commit -m "$(cat <<'EOF'
          Golden set: top 100 per NOS category (${COUNT} cases total)

          Option B: scored by clusters (citations*5 + published*10 + scotus*100).
          Each case has docket.json + opinions/ with cluster subfolders,
          each opinion in its own file. Full opinion text via API.
          cases2.1/ is a clean backup of cases2/.
          EOF
          )"
          git push || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-${{ github.run_id }}
          path: golden_set/
          retention-days: 90
